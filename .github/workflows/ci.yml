name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync generated project assets
        run: pnpm run sync:projects

      - name: Verify GitHub repository config
        run: pnpm run verify:github

      - name: Verify project registry
        run: pnpm run verify:projects

      - name: Smoke test project runtime
        run: pnpm run smoke:projects

      - name: Build production bundle
        run: pnpm run build

      - name: Check production bundle budget
        run: pnpm run budget:build

      - name: Smoke test production preview
        run: pnpm run preview:check
