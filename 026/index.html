<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript BM25 search laboratory using tokenization, inverted index construction, document ranking, query explanations, Canvas 2D score visualization, JSON export, and PNG capture."><title>026 - BM25 Search Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">BM25 Search Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="searchCanvas" width="1280" height="720" aria-label="BM25 ranking visualization"></canvas><div class="canvas-readout"><span id="modeBadge">BM25</span><span id="hitBadge">0 hits</span><span id="queryBadge">Query</span></div></div><div class="metrics-bar"><div><span>Docs</span><strong id="docValue">0</strong></div><div><span>Vocab</span><strong id="vocabValue">0</strong></div><div><span>Avg Len</span><strong id="avgValue">0</strong></div><div><span>Terms</span><strong id="termValue">0</strong></div><div><span>Hits</span><strong id="hitValue">0</strong></div><div><span>Top Score</span><strong id="scoreValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Status</span><strong id="statusValue">Ready</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Search</h2><label for="queryText">Query</label><input id="queryText" value="procedural rendering geometry"><div class="button-row"><button id="runButton" type="button">Search</button><button id="benchmarkButton" type="button">Benchmark</button></div></section><section class="control-group"><h2>Evidence</h2><div class="button-row button-row-two"><button id="pngButton" type="button">PNG</button><button id="jsonButton" type="button">JSON</button></div><button id="reportButton" type="button">Copy technical report</button></section></aside></main><script src="search-core.js"></script><script src="main.js"></script></body></html>
