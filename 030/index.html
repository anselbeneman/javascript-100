<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript Marching Squares lab with procedural scalar fields, interpolated contour extraction, ambiguous-cell handling, Canvas 2D visualization, topology metrics, benchmark mode, and JSON export."><title>030 - Marching Squares Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Marching Squares Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="marchingCanvas" width="1280" height="720" aria-label="Marching Squares contour field"></canvas><div class="canvas-readout"><span id="thresholdBadge">Threshold 0.00</span><span id="phaseBadge">Phase 0.18</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Segments</span><strong id="segmentValue">0</strong></div><div><span>Cells</span><strong id="cellValue">0</strong></div><div><span>Ambiguous</span><strong id="ambiguousValue">0</strong></div><div><span>Active</span><strong id="activeValue">0%</strong></div><div><span>Min</span><strong id="minValue">0</strong></div><div><span>Max</span><strong id="maxValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Method</span><strong>16 cases</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Field</h2><label for="thresholdRange">Threshold <span id="thresholdValue">0.00</span></label><input id="thresholdRange" type="range" min="-60" max="60" value="0"><label for="phaseRange">Phase <span id="phaseValue">0.18</span></label><input id="phaseRange" type="range" min="0" max="100" value="18"><label for="resolutionRange">Resolution <span id="resolutionValue">56</span></label><input id="resolutionRange" type="range" min="28" max="80" value="56"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="marching-core.js"></script><script src="main.js"></script></body></html>
