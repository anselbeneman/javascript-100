<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript particle swarm optimizer with deterministic particles, Rosenbrock and Rastrigin objective functions, velocity updates, convergence tracking, Canvas 2D search rendering, benchmark mode, and JSON export."><title>042 - Particle Swarm Optimizer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Particle Swarm Optimizer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="psoCanvas" width="1280" height="720" aria-label="Particle swarm optimizer field"></canvas><div class="canvas-readout"><span id="objectiveBadge">Rosenbrock</span><span id="scoreBadge">Score 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Particles</span><strong id="particleValue">0</strong></div><div><span>Iterations</span><strong id="iterationValue">0</strong></div><div><span>Best</span><strong id="bestValue">0</strong></div><div><span>X</span><strong id="xValue">0</strong></div><div><span>Y</span><strong id="yValue">0</strong></div><div><span>Improve</span><strong id="improveValue">0x</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Method</span><strong>PSO</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Swarm</h2><label for="objectiveSelect">Objective</label><select id="objectiveSelect"><option value="rosenbrock">Rosenbrock</option><option value="rastrigin">Rastrigin</option></select><label for="particleRange">Particles <span id="particleText">64</span></label><input id="particleRange" type="range" min="20" max="120" step="4" value="64"><label for="iterationRange">Iterations <span id="iterationText">90</span></label><input id="iterationRange" type="range" min="20" max="180" step="10" value="90"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="pso-core.js"></script><script src="main.js"></script></body></html>
