<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript Huffman compression lab with frequency analysis, deterministic priority queue tree building, prefix-code encoding and decoding, Canvas 2D code visualization, benchmark mode, and JSON export."><title>033 - Huffman Compression Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Huffman Compression Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="huffmanCanvas" width="1280" height="720" aria-label="Huffman compression code chart"></canvas><div class="canvas-readout"><span id="sampleBadge">Telemetry</span><span id="ratioBadge">Ratio 0%</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Symbols</span><strong id="symbolValue">0</strong></div><div><span>Unique</span><strong id="uniqueValue">0</strong></div><div><span>Bits</span><strong id="bitValue">0</strong></div><div><span>Fixed</span><strong id="fixedValue">0</strong></div><div><span>Ratio</span><strong id="ratioValue">0%</strong></div><div><span>Depth</span><strong id="depthValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Decode</span><strong id="decodeValue">Ready</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Text</h2><label for="sampleSelect">Sample</label><select id="sampleSelect"><option value="telemetry">Telemetry</option><option value="portfolio">Portfolio</option><option value="systems">Systems</option></select><label for="textInput">Custom input</label><textarea id="textInput" rows="6" spellcheck="false"></textarea><button id="analyzeButton" type="button">Analyze</button></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="huffman-core.js"></script><script src="main.js"></script></body></html>
