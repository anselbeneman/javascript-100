<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript logistic regression trainer with deterministic binary datasets, sigmoid scoring, gradient descent, loss and accuracy telemetry, Canvas 2D decision-boundary rendering, benchmark mode, and JSON export."><title>043 - Logistic Regression Trainer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Logistic Regression Trainer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="logisticCanvas" width="1280" height="720" aria-label="Logistic regression decision boundary"></canvas><div class="canvas-readout"><span id="sampleBadge">240 samples</span><span id="accuracyBadge">Accuracy 0%</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Samples</span><strong id="sampleValue">0</strong></div><div><span>Epochs</span><strong id="epochValue">0</strong></div><div><span>Loss</span><strong id="lossValue">0</strong></div><div><span>Accuracy</span><strong id="accuracyValue">0%</strong></div><div><span>Wx</span><strong id="wxValue">0</strong></div><div><span>Wy</span><strong id="wyValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Model</span><strong>Sigmoid</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Training</h2><label for="sampleRange">Samples <span id="sampleText">240</span></label><input id="sampleRange" type="range" min="80" max="520" step="20" value="240"><label for="epochRange">Epochs <span id="epochText">220</span></label><input id="epochRange" type="range" min="40" max="520" step="20" value="220"><label for="rateRange">Learning rate <span id="rateText">0.85</span></label><input id="rateRange" type="range" min="20" max="140" value="85"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="logistic-core.js"></script><script src="main.js"></script></body></html>
