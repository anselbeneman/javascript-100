<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript decision tree lab with deterministic synthetic data, Gini impurity scoring, recursive feature splits, classifier evaluation, Canvas 2D tree rendering, benchmark mode, and JSON export."><title>034 - Decision Tree Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Decision Tree Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="treeCanvas" width="1280" height="720" aria-label="Decision tree classifier"></canvas><div class="canvas-readout"><span id="depthBadge">Depth 5</span><span id="accuracyBadge">Accuracy 0%</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Rows</span><strong id="rowValue">0</strong></div><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Train</span><strong id="trainValue">0%</strong></div><div><span>Test</span><strong id="testValue">0%</strong></div><div><span>Impurity</span><strong id="impurityValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Split</span><strong>Gini</strong></div><div><span>Model</span><strong>CART</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Model</h2><label for="depthRange">Max depth <span id="depthValue">5</span></label><input id="depthRange" type="range" min="2" max="7" value="5"><label for="rowRange">Rows <span id="rowsValue">180</span></label><input id="rowRange" type="range" min="80" max="360" step="20" value="180"><label for="seedRange">Seed <span id="seedValue">34</span></label><input id="seedRange" type="range" min="1" max="99" value="34"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="tree-core.js"></script><script src="main.js"></script></body></html>
