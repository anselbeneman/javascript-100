<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript FFT spectrum analyzer with generated audio signals, iterative Cooley-Tukey transform, windowing, dominant-frequency detection, Canvas 2D waveform and spectrum rendering, benchmark mode, and JSON export."><title>032 - FFT Spectrum Analyzer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">FFT Spectrum Analyzer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="fftCanvas" width="1280" height="720" aria-label="FFT waveform and spectrum"></canvas><div class="canvas-readout"><span id="baseBadge">256 Hz</span><span id="peakBadge">Peak 0 Hz</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Samples</span><strong id="sampleValue">0</strong></div><div><span>Bins</span><strong id="binValue">0</strong></div><div><span>Peak Hz</span><strong id="peakValue">0</strong></div><div><span>Peak Mag</span><strong id="magValue">0</strong></div><div><span>RMS</span><strong id="rmsValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Window</span><strong>Hann</strong></div><div><span>FFT</span><strong>Iterative</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Signal</h2><label for="baseRange">Base <span id="baseValue">256 Hz</span></label><input id="baseRange" type="range" min="128" max="512" step="8" value="256"><label for="secondRange">Second <span id="secondValue">640 Hz</span></label><input id="secondRange" type="range" min="384" max="1280" step="8" value="640"><label for="mixRange">Mix <span id="mixValue">0.50</span></label><input id="mixRange" type="range" min="10" max="90" value="50"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="fft-core.js"></script><script src="main.js"></script></body></html>
