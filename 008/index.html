<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vanilla JavaScript audio spectrum visualizer using Web Audio API FFT analysis, Canvas rendering, demo synthesis, local file decoding, visual presets, live diagnostics, and PNG export.">
  <title>008 - Audio Spectrum Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell" aria-labelledby="project-title">
    <section class="stage" aria-label="Audio visualization stage">
      <header class="stage-header">
        <h1 id="project-title" class="visually-hidden">Audio Spectrum Visualizer</h1>
        <div class="status">
          <span id="sourceStatus">Idle source</span>
          <strong id="audioStatus">Audio locked</strong>
        </div>
      </header>
      <div class="canvas-frame">
        <canvas id="visualizerCanvas" width="1280" height="720" aria-label="Live audio spectrum visualization"></canvas>
        <span id="energyMeter" class="energy-meter"></span>
      </div>
    </section>

    <aside class="panel" aria-label="Audio visualizer controls">
      <section class="metrics" aria-label="Live metrics">
        <article><span>Peak</span><strong id="peakMetric">-- Hz</strong></article>
        <article><span>RMS</span><strong id="rmsMetric">0%</strong></article>
        <article><span>Beat</span><strong id="beatMetric">0.00</strong></article>
        <article><span>FPS</span><strong id="fpsMetric">0</strong></article>
      </section>

      <section class="control">
        <div class="section-title"><h2>Source</h2><span id="binsMetric">0 bins</span></div>
        <div class="buttons">
          <button id="startDemoButton" type="button">Start demo</button>
          <button id="stopButton" type="button">Stop</button>
        </div>
        <label>Audio file<input id="audioFileInput" type="file" accept="audio/*"></label>
      </section>

      <section class="control">
        <div class="section-title"><h2>View</h2><span id="viewStatus">Spectrum</span></div>
        <label>Mode
          <select id="modeSelect">
            <option value="spectrum" selected>Spectrum</option>
            <option value="radial">Radial</option>
            <option value="waveform">Waveform</option>
            <option value="spectrogram">Spectrogram</option>
          </select>
        </label>
        <label>Palette
          <select id="paletteSelect">
            <option value="signal" selected>Signal</option>
            <option value="aurora">Aurora</option>
            <option value="thermal">Thermal</option>
          </select>
        </label>
      </section>

      <section class="control">
        <div class="section-title"><h2>Analysis</h2><span>FFT</span></div>
        <label>FFT size
          <select id="fftSelect">
            <option value="1024">1024</option>
            <option value="2048" selected>2048</option>
            <option value="4096">4096</option>
          </select>
        </label>
        <label>Smoothing<input id="smoothingInput" type="range" min="0" max="0.95" step="0.01" value="0.74"><output id="smoothingValue">0.74</output></label>
        <label>Sensitivity<input id="sensitivityInput" type="range" min="0.6" max="2.4" step="0.05" value="1.35"><output id="sensitivityValue">1.35</output></label>
        <label>Volume<input id="volumeInput" type="range" min="0" max="0.7" step="0.01" value="0.14"><output id="volumeValue">0.14</output></label>
      </section>

      <section class="actions">
        <button id="freezeButton" type="button">Freeze</button>
        <button id="randomizeButton" type="button">Randomize</button>
        <button id="exportButton" type="button">Export PNG</button>
      </section>
    </aside>
  </main>

  <script src="main.js"></script>
</body>
</html>
