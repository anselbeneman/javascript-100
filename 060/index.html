<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript KMP string search lab with prefix-function construction, linear scanning, brute-force match verification, Canvas 2D prefix rendering, benchmark mode, PNG export, and JSON evidence."><title>060 - KMP String Search Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">KMP String Search Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="projectCanvas" width="1280" height="720" aria-label="KMP String Search Lab visualization"></canvas><div class="canvas-readout"><span id="modeBadge">KMP</span><span id="scoreBadge">Score 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Items</span><strong id="itemValue">0</strong></div><div><span>Score</span><strong id="scoreValue">0</strong></div><div><span>Extra</span><strong id="extraValue">0</strong></div><div><span>Verified</span><strong id="verifiedValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Runtime</span><strong>O(n+m)</strong></div><div><span>Core</span><strong>Vanilla</strong></div><div><span>Export</span><strong>JSON</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Input</h2><label for="seedRange">Seed <span id="seedText">60</span></label><input id="seedRange" type="range" min="1" max="99" value="60"><label for="sizeRange">Size <span id="sizeText">180</span></label><input id="sizeRange" type="range" min="60" max="520" step="20" value="180"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="core.js"></script><script src="main.js"></script></body></html>
