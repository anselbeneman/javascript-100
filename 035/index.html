<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript K-means color quantizer with deterministic RGB sample clouds, centroid updates, inertia tracking, palette extraction, Canvas 2D cluster rendering, benchmark mode, PNG export, and JSON evidence."><title>035 - K-Means Color Quantizer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">K-Means Color Quantizer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="kmeansCanvas" width="1280" height="720" aria-label="K-means color clusters"></canvas><div class="canvas-readout"><span id="clusterBadge">5 clusters</span><span id="inertiaBadge">Inertia 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Samples</span><strong id="sampleValue">0</strong></div><div><span>K</span><strong id="kValue">0</strong></div><div><span>Iterations</span><strong id="iterationMetric">0</strong></div><div><span>Inertia</span><strong id="inertiaValue">0</strong></div><div><span>Improve</span><strong id="improveValue">0%</strong></div><div><span>Empty</span><strong id="emptyValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Palette</span><strong>RGB</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Clusters</h2><label for="kRange">K <span id="kText">5</span></label><input id="kRange" type="range" min="2" max="8" value="5"><label for="iterationRange">Iterations <span id="iterationText">14</span></label><input id="iterationRange" type="range" min="2" max="30" value="14"><label for="sampleRange">Samples <span id="sampleText">360</span></label><input id="sampleRange" type="range" min="120" max="720" step="60" value="360"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="kmeans-core.js"></script><script src="main.js"></script></body></html>
