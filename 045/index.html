<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript simulated annealing route optimizer with deterministic cities, temperature schedules, 2-opt neighbor swaps, acceptance probability telemetry, Canvas 2D route rendering, benchmark mode, and JSON export."><title>045 - Simulated Annealing Route Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Simulated Annealing Route Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="annealCanvas" width="1280" height="720" aria-label="Simulated annealing route optimizer"></canvas><div class="canvas-readout"><span id="cityBadge">28 cities</span><span id="bestBadge">Best 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Cities</span><strong id="cityValue">0</strong></div><div><span>Iterations</span><strong id="iterationValue">0</strong></div><div><span>Initial</span><strong id="initialValue">0</strong></div><div><span>Best</span><strong id="bestValue">0</strong></div><div><span>Improve</span><strong id="improveValue">0%</strong></div><div><span>Accepted</span><strong id="acceptedValue">0%</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Move</span><strong>2-opt</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Annealing</h2><label for="cityRange">Cities <span id="cityText">28</span></label><input id="cityRange" type="range" min="12" max="54" step="2" value="28"><label for="iterationRange">Iterations <span id="iterationText">2200</span></label><input id="iterationRange" type="range" min="400" max="5200" step="200" value="2200"><label for="tempRange">Temperature <span id="tempText">1.40</span></label><input id="tempRange" type="range" min="40" max="240" value="140"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="anneal-core.js"></script><script src="main.js"></script></body></html>
