<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript Markov text chain lab with tokenization, transition tables, deterministic corpus analysis, entropy metrics, Canvas 2D distribution rendering, benchmark mode, PNG export, and JSON evidence."><title>046 - Markov Text Chain Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Markov Text Chain Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="projectCanvas" width="1280" height="720" aria-label="Markov Text Chain Lab visualization"></canvas><div class="canvas-readout"><span id="modeBadge">Markov</span><span id="scoreBadge">Score 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Items</span><strong id="itemValue">0</strong></div><div><span>Score</span><strong id="scoreValue">0</strong></div><div><span>Extra</span><strong id="extraValue">0</strong></div><div><span>Verified</span><strong id="verifiedValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Runtime</span><strong>O(n)</strong></div><div><span>Core</span><strong>Vanilla</strong></div><div><span>Export</span><strong>JSON</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Input</h2><label for="seedRange">Seed <span id="seedText">46</span></label><input id="seedRange" type="range" min="1" max="99" value="46"><label for="sizeRange">Size <span id="sizeText">100</span></label><input id="sizeRange" type="range" min="40" max="240" step="10" value="100"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div
