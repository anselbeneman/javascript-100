<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Vanilla JavaScript fractal explorer using Canvas 2D, Web Worker pixel rendering, Mandelbrot and Julia sets, smooth coloring, pointer zoom, palette controls, diagnostics, benchmark timing, JSON export, and PNG capture."
  >
  <title>006 - Fractal Explorer Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="fractal-shell" aria-labelledby="project-title">
    <h1 id="project-title" class="visually-hidden">Fractal Explorer Studio</h1>

    <section class="viewport-panel" aria-label="Fractal canvas">
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="fractalCanvas" width="960" height="540" aria-label="Interactive fractal render"></canvas>
        <div class="canvas-readout" aria-hidden="true">
          <span id="setBadge">Mandelbrot</span>
          <span id="paletteBadge">Nebula</span>
          <span id="zoomBadge">Zoom 1.00x</span>
        </div>
      </div>

      <div class="metrics-bar" aria-label="Fractal render metrics">
        <div><span>Render</span><strong id="renderValue">0 ms</strong></div>
        <div><span>Pixels</span><strong id="pixelsValue">0</strong></div>
        <div><span>Iterations</span><strong id="iterationsValue">240</strong></div>
        <div><span>Zoom</span><strong id="zoomValue">1.00x</strong></div>
        <div><span>Center X</span><strong id="centerXValue">-0.5</strong></div>
        <div><span>Center Y</span><strong id="centerYValue">0.0</strong></div>
        <div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div>
        <div><span>Status</span><strong id="statusValue" aria-live="polite">Ready</strong></div>
      </div>
    </section>

    <aside class="control-panel" aria-label="Fractal controls">
      <section class="control-group" aria-labelledby="scene-heading">
        <h2 id="scene-heading">Scene</h2>
        <label for="presetSelect">Preset</label>
        <select id="presetSelect">
          <option value="cardioid" selected>Cardioid Sweep</option>
          <option value="seahorse">Seahorse Valley</option>
          <option value="elephant">Elephant Valley</option>
          <option value="spiralJulia">Spiral Julia</option>
          <option value="dendriteJulia">Dendrite Julia</option>
        </select>

        <label for="setSelect">Set</label>
        <select id="setSelect">
          <option value="mandelbrot" selected>Mandelbrot</option>
          <option value="julia">Julia</option>
        </select>

        <label for="paletteSelect">Palette</label>
        <select id="paletteSelect">
          <option value="nebula" selected>Nebula</option>
          <option value="ember">Ember</option>
          <option value="ice">Ice</option>
          <option value="mono">Mono</option>
        </select>

        <div class="button-row">
          <button id="renderButton" type="button">Render</button>
          <button id="resetButton" type="button">Reset</button>
          <button id="benchmarkButton" type="button">Benchmark</button>
        </div>
      </section>

      <section class="control-group" aria-labelledby="camera-heading">
        <h2 id="camera-heading">Camera</h2>
        <label for="resolutionSelect">Resolution</label>
        <select id="resolutionSelect">
          <option value="480x270">480 x 270</option>
          <option value="640x360" selected>640 x 360</option>
          <option value="800x450">800 x 450</option>
          <option value="960x540">960 x 540</option>
        </select>

        <label for="zoomRange">
          <span>Zoom</span>
          <output id="zoomControlValue" for="zoomRange">1.00x</output>
        </label>
        <input id="zoomRange" type="range" min="0" max="8" step="0.05" value="0">

        <label for="iterationsRange">
          <span>Iterations</span>
          <output id="iterationsControlValue" for="iterationsRange">240</output>
        </label>
        <input id="iterationsRange" type="range" min="80" max="1200" step="20" value="240">

        <label for="bailoutRange">
          <span>Bailout</span>
          <output id="bailoutValue" for="bailoutRange">4.0</output>
        </label>
        <input id="bailoutRange" type="range" min="2" max="16" step="0.5" value="4">
      </section>

      <section class="control-group" aria-labelledby="julia-heading">
        <h2 id="julia-heading">Julia</h2>
        <label for="juliaXRange">
          <span>Constant X</span>
          <output id="juliaXValue" for="juliaXRange">-0.72</output>
        </label>
        <input id="juliaXRange" type="range" min="-1" max="1" step="0.01" value="-0.72">

        <label for="juliaYRange">
          <span>Constant Y</span>
          <output id="juliaYValue" for="juliaYRange">0.24</output>
        </label>
        <input id="juliaYRange" type="range" min="-1" max="1" step="0.01" value="0.24">

        <label class="toggle-row" for="smoothToggle">
          <span>Smooth Coloring</span>
          <input id="smoothToggle" type="checkbox" checked>
        </label>
      </section>

      <section class="control-group" aria-labelledby="evidence-heading">
        <h2 id="evidence-heading">Evidence</h2>
        <div class="button-row button-row-two">
          <button id="pngButton" type="button">PNG</button>
          <button id="jsonButton" type="button">JSON</button>
        </div>
        <button id="shareButton" type="button">Copy share link</button>
      </section>
    </aside>
  </main>
  <script src="fractal-core.js"></script>
  <script src="main.js"></script>
</body>
</html>
