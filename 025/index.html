<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript regex NFA engine using parsing, Thompson-style automata construction, epsilon closure simulation, Canvas 2D graph rendering, diagnostics, JSON export, and PNG capture."><title>025 - Regex NFA Engine</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Regex NFA Engine</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="regexCanvas" width="1280" height="720" aria-label="Regex NFA graph"></canvas><div class="canvas-readout"><span id="modeBadge">NFA</span><span id="matchBadge">Ready</span><span id="patternBadge">(a|b)*abb</span></div></div><div class="metrics-bar"><div><span>States</span><strong id="stateValue">0</strong></div><div><span>Edges</span><strong id="edgeValue">0</strong></div><div><span>Epsilon</span><strong id="epsilonValue">0</strong></div><div><span>Input</span><strong id="inputValue">0</strong></div><div><span>Trace</span><strong id="traceValue">0</strong></div><div><span>Matched</span><strong id="matchedValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Status</span><strong id="statusValue">Ready</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Pattern</h2><label for="patternSelect">Preset</label><select id="patternSelect"><option value="(a|b)*abb" selected>Ends ABB</option><option value="a(b|c)*d">A then D</option><option value="(ab|ba)*c">Pairs then C</option></select><label for="inputText">Input</label><input id="inputText" value="aababb"><div class="button-row"><button id="runButton" type="button">Run</button><button id="benchmarkButton" type="button">Benchmark</button></div></section><section class="control-group"><h2>Evidence</h2><div class="button-row button-row-two"><button id="pngButton" type="button">PNG</button><button id="jsonButton" type="button">JSON</button></div><button id="reportButton" type="button">Copy technical report</button></section></aside></main><script src="regex-core.js"></script><script src="main.js"></script></body></html>
