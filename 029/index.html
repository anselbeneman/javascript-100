<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript A-star pathfinding lab with deterministic obstacle fields, binary-heap frontier, Manhattan and diagonal heuristics, Canvas 2D route rendering, telemetry, benchmark mode, and JSON export."><title>029 - A-Star Pathfinding Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">A-Star Pathfinding Lab</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="pathCanvas" width="1280" height="720" aria-label="A-star pathfinding grid"></canvas><div class="canvas-readout"><span id="heuristicBadge">Diagonal</span><span id="densityBadge">24% walls</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Path</span><strong id="pathValue">0</strong></div><div><span>Visited</span><strong id="visitedValue">0</strong></div><div><span>Cost</span><strong id="costValue">0</strong></div><div><span>Turns</span><strong id="turnValue">0</strong></div><div><span>Pushes</span><strong id="pushValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Open Set</span><strong>Heap</strong></div><div><span>Status</span><strong id="solvedValue">Ready</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Search</h2><label for="heuristicSelect">Heuristic</label><select id="heuristicSelect"><option value="diagonal">Diagonal</option><option value="manhattan">Manhattan</option></select><label for="densityRange">Walls <span id="densityValue">24%</span></label><input id="densityRange" type="range" min="8" max="38" value="24"><label for="seedRange">Seed <span id="seedValue">29</span></label><input id="seedRange" type="range" min="1" max="99" value="29"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="path-core.js"></script><script src="main.js"></script></body></html>
