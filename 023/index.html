<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vanilla JavaScript probabilistic data structure laboratory using Bloom filters, HyperLogLog cardinality estimation, deterministic streams, false-positive diagnostics, Canvas 2D register rendering, JSON export, and PNG capture.">
  <title>023 - Probabilistic Data Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="project-title">
    <h1 id="project-title" class="visually-hidden">Probabilistic Data Lab</h1>
    <section class="viewport-panel">
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="probCanvas" width="1280" height="720" aria-label="Probabilistic data structure visualization"></canvas>
        <div class="canvas-readout"><span id="modeBadge">Bloom + HLL</span><span id="streamBadge">0 items</span><span id="seedBadge">Seed 23</span></div>
      </div>
      <div class="metrics-bar">
        <div><span>Unique</span><strong id="uniqueValue">0</strong></div>
        <div><span>HLL Est</span><strong id="estimateValue">0</strong></div>
        <div><span>HLL Error</span><strong id="hllErrorValue">0%</strong></div>
        <div><span>Bloom Fill</span><strong id="fillValue">0%</strong></div>
        <div><span>False Pos</span><strong id="falsePositiveValue">0%</strong></div>
        <div><span>Memory</span><strong id="memoryValue">0 B</strong></div>
        <div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div>
        <div><span>Status</span><strong id="statusValue">Ready</strong></div>
      </div>
    </section>
    <aside class="control-panel">
      <section class="control-group">
        <h2>Stream</h2>
        <div class="button-row">
          <button id="runButton" type="button">Analyze</button>
          <button id="benchmarkButton" type="button">Benchmark</button>
          <button id="seedButton" type="button">Seed</button>
        </div>
      </section>
      <section class="control-group">
        <h2>Parameters</h2>
        <label for="countRange"><span>Items</span><output id="countValue">2400</output></label>
        <input id="countRange" type="range" min="400" max="9000" step="100" value="2400">
        <label for="bloomRange"><span>Bloom Bits</span><output id="bloomValue">8192</output></label>
        <input id="bloomRange" type="range" min="1024" max="32768" step="512" value="8192">
        <label for="precisionRange"><span>HLL Precision</span><output id="precisionValue">8</output></label>
        <input id="precisionRange" type="range" min="5" max="12" step="1" value="8">
      </section>
      <section class="control-group">
        <h2>Evidence</h2>
        <div class="button-row button-row-two"><button id="pngButton" type="button">PNG</button><button id="jsonButton" type="button">JSON</button></div>
        <button id="reportButton" type="button">Copy technical report</button>
      </section>
    </aside>
  </main>
  <script src="prob-core.js"></script>
  <script src="main.js"></script>
</body>
</html>
