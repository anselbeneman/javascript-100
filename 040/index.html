<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript AVL tree balancer with deterministic key insertion, left and right rotations, height tracking, balance-factor validation, Canvas 2D tree rendering, benchmark mode, PNG export, and JSON evidence."><title>040 - AVL Tree Balancer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">AVL Tree Balancer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="avlCanvas" width="1280" height="720" aria-label="AVL tree visualization"></canvas><div class="canvas-readout"><span id="countBadge">48 keys</span><span id="heightBadge">Height 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Keys</span><strong id="keyValue">0</strong></div><div><span>Height</span><strong id="heightValue">0</strong></div><div><span>Rotations</span><strong id="rotationValue">0</strong></div><div><span>Max BF</span><strong id="balanceValue">0</strong></div><div><span>Limit</span><strong id="limitValue">0</strong></div><div><span>Valid</span><strong id="validValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Tree</span><strong>AVL</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Insert</h2><label for="countRange">Keys <span id="countText">48</span></label><input id="countRange" type="range" min="12" max="96" step="6" value="48"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="avl-core.js"></script><script src="main.js"></script></body></html>
