<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Panel</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: min(420px, calc(100vw - 32px));
            padding: 28px;
            border: 1px solid #315c3f;
            border-radius: 14px;
            background: #203026;
        }

        .eyebrow {
            margin-bottom: 12px;
            color: #83d09d;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #d6e6da;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="panel">
        <div class="eyebrow">Viewer check</div>
        <h1>Status Panel</h1>
        <p>Minimal interface used to confirm routing, iframe loading, and project metadata.</p>
    </main>
    <script>console.log('Status panel loaded');</script>
</body>
