<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Preview Card</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(420px, calc(100vw - 32px));
            padding: 28px;
            border: 1px solid #333;
            border-radius: 14px;
            background: #222;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #c9c9c9;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Dark Preview Card</h1>
        <p>Exercise for spacing, contrast, and responsive sizing inside the project viewer.</p>
    </main>
    <script>console.log('Dark preview card loaded');</script>
</body>
