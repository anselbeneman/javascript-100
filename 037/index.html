<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript ear clipping triangulator with deterministic concave polygons, orientation correction, point-in-triangle tests, area preservation checks, Canvas 2D mesh rendering, benchmark mode, and JSON export."><title>037 - Ear Clipping Triangulator</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Ear Clipping Triangulator</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="triCanvas" width="1280" height="720" aria-label="Ear clipping triangulation mesh"></canvas><div class="canvas-readout"><span id="vertexBadge">15 vertices</span><span id="triangleBadge">0 triangles</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Vertices</span><strong id="vertexValue">0</strong></div><div><span>Triangles</span><strong id="triangleValue">0</strong></div><div><span>Expected</span><strong id="expectedValue">0</strong></div><div><span>Area</span><strong id="areaValue">0</strong></div><div><span>Error</span><strong id="errorValue">0</strong></div><div><span>Guards</span><strong id="guardValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Method</span><strong>Ear clip</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Polygon</h2><label for="vertexRange">Vertices <span id="vertexText">15</span></label><input id="vertexRange" type="range" min="7" max="27" value="15"><label for="notchRange">Concavity <span id="notchText">0.58</span></label><input id="notchRange" type="range" min="38" max="78" value="58"><label for="phaseRange">Phase <span id="phaseText">0.20</span></label><input id="phaseRange" type="range" min="0" max="100" value="20"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="triangulate-core.js"></script><script src="main.js"></script></body></html>
