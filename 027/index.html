<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript Pratt parser studio using tokenization, operator precedence, prefix and infix binding powers, AST evaluation, Canvas 2D syntax tree rendering, JSON export, and PNG capture."><title>027 - Pratt Parser Studio</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Pratt Parser Studio</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="parserCanvas" width="1280" height="720" aria-label="Pratt parser AST"></canvas><div class="canvas-readout"><span id="modeBadge">Pratt</span><span id="valueBadge">0</span><span id="sourceBadge">Expression</span></div></div><div class="metrics-bar"><div><span>Tokens</span><strong id="tokenValue">0</strong></div><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Depth</span><strong id="depthValue">0</strong></div><div><span>Value</span><strong id="resultValue">0</strong></div><div><span>Status</span><strong id="statusValue">Ready</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Parser</span><strong>Pratt</strong></div><div><span>AST</span><strong>Canvas</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Expression</h2><label for="sourceInput">Source</label><input id="sourceInput" value="3 + 4 * 2 / (1 - 5)^2^3"><div class="button-row"><button id="runButton" type="button">Parse</button><button id="benchmarkButton" type="button">Benchmark</button></div></section><section class="control-group"><h2>Evidence</h2><div class="button-row button-row-two"><button id="pngButton" type="button">PNG</button><button id="jsonButton" type="button">JSON</button></div><button id="reportButton" type="button">Copy technical report</button></section></aside></main><script src="parser-core.js"></script><script src="main.js"></script></body></html>
