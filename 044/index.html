<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript quadtree range-query engine with deterministic spatial points, subdivision, rectangular queries, brute-force verification, Canvas 2D index rendering, benchmark mode, PNG export, and JSON evidence."><title>044 - Quadtree Range Query</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Quadtree Range Query</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="quadCanvas" width="1280" height="720" aria-label="Quadtree spatial index"></canvas><div class="canvas-readout"><span id="pointBadge">520 points</span><span id="hitBadge">0 hits</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Points</span><strong id="pointValue">0</strong></div><div><span>Hits</span><strong id="hitValue">0</strong></div><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Depth</span><strong id="depthValue">0</strong></div><div><span>Visited</span><strong id="visitedValue">0</strong></div><div><span>Verified</span><strong id="verifiedValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Index</span><strong>Quadtree</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Index</h2><label for="countRange">Points <span id="countText">520</span></label><input id="countRange" type="range" min="120" max="1200" step="40" value="520"><label for="capacityRange">Capacity <span id="capacityText">8</span></label><input id="capacityRange" type="range" min="4" max="18" value="8"><label for="seedRange">Seed <span id="seedText">44</span></label><input id="seedRange" type="range" min="1" max="99" value="44"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="quadtree-core.js"></script><script src="main.js"></script></body></html>
