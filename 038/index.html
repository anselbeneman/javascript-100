<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript topological scheduler with deterministic DAG generation, Kahn ordering, cycle checks, critical-path timing, Canvas 2D dependency rendering, benchmark mode, PNG export, and JSON evidence."><title>038 - Topological Scheduler</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Topological Scheduler</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="scheduleCanvas" width="1280" height="720" aria-label="Topological dependency scheduler"></canvas><div class="canvas-readout"><span id="nodeBadge">16 tasks</span><span id="durationBadge">0 days</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Edges</span><strong id="edgeValue">0</strong></div><div><span>Critical</span><strong id="criticalValue">0</strong></div><div><span>Path</span><strong id="pathValue">0</strong></div><div><span>Valid</span><strong id="validValue">No</strong></div><div><span>Cycle</span><strong id="cycleValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Sort</span><strong>Kahn</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Graph</h2><label for="nodeRange">Tasks <span id="nodeText">16</span></label><input id="nodeRange" type="range" min="8" max="28" value="16"><label for="densityRange">Density <span id="densityText">0.22</span></label><input id="densityRange" type="range" min="10" max="40" value="22"><label for="seedRange">Seed <span id="seedText">38</span></label><input id="seedRange" type="range" min="1" max="99" value="38"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="scheduler-core.js"></script><script src="main.js"></script></body></html>
