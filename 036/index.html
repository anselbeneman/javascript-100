<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript minimax game solver with tic-tac-toe state evaluation, alpha-beta pruning, optimal move search, node telemetry, Canvas 2D board rendering, benchmark mode, PNG export, and JSON evidence."><title>036 - Minimax Game Solver</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Minimax Game Solver</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="minimaxCanvas" width="1280" height="720" aria-label="Minimax tic-tac-toe board"></canvas><div class="canvas-readout"><span id="presetBadge">Attack</span><span id="moveBadge">Move -</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Player</span><strong id="playerValue">X</strong></div><div><span>Move</span><strong id="moveValue">-</strong></div><div><span>Score</span><strong id="scoreValue">0</strong></div><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Prunes</span><strong id="pruneValue">0</strong></div><div><span>Legal</span><strong id="legalValue">0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Search</span><strong>Alpha-beta</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Position</h2><label for="presetSelect">Preset</label><select id="presetSelect"><option value="attack">Attack</option><option value="fork">Fork</option><option value="defense">Defense</option></select><button id="solveButton" type="button">Solve</button></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="minimax-core.js"></script><script src="main.js"></script></body></html>
