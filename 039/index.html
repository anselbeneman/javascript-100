<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript B-tree index visualizer with deterministic key insertion, node splitting, logarithmic search, height and occupancy metrics, Canvas 2D tree rendering, benchmark mode, PNG export, and JSON evidence."><title>039 - B-Tree Index Visualizer</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">B-Tree Index Visualizer</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="btreeCanvas" width="1280" height="720" aria-label="B-tree index visualization"></canvas><div class="canvas-readout"><span id="degreeBadge">Degree 3</span><span id="targetBadge">Target 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Keys</span><strong id="keyValue">0</strong></div><div><span>Nodes</span><strong id="nodeValue">0</strong></div><div><span>Height</span><strong id="heightValue">0</strong></div><div><span>Depth</span><strong id="depthValue">0</strong></div><div><span>Occupancy</span><strong id="occupancyValue">0%</strong></div><div><span>Found</span><strong id="foundValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Index</span><strong>B-tree</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Index</h2><label for="degreeRange">Degree <span id="degreeText">3</span></label><input id="degreeRange" type="range" min="2" max="5" value="3"><label for="countRange">Keys <span id="countText">42</span></label><input id="countRange" type="range" min="18" max="84" step="6" value="42"><label for="targetRange">Target slot <span id="targetText">26</span></label><input id="targetRange" type="range" min="0" max="41" value="26"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="btree-core.js"></script><script src="main.js"></script></body></html>
