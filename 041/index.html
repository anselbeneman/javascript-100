<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript convex hull workbench with deterministic point clouds, monotonic-chain hull construction, orientation tests, area and perimeter metrics, Canvas 2D geometry rendering, benchmark mode, and JSON export."><title>041 - Convex Hull Workbench</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Convex Hull Workbench</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="hullCanvas" width="1280" height="720" aria-label="Convex hull point cloud"></canvas><div class="canvas-readout"><span id="pointBadge">160 points</span><span id="hullBadge">Hull 0</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Points</span><strong id="pointValue">0</strong></div><div><span>Hull</span><strong id="hullValue">0</strong></div><div><span>Area</span><strong id="areaValue">0</strong></div><div><span>Perimeter</span><strong id="perimeterValue">0</strong></div><div><span>Contains</span><strong id="containsValue">No</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Sort</span><strong>O(n log n)</strong></div><div><span>Method</span><strong>Monotonic</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Cloud</h2><label for="countRange">Points <span id="countText">160</span></label><input id="countRange" type="range" min="40" max="420" step="20" value="160"><label for="seedRange">Seed <span id="seedText">41</span></label><input id="seedRange" type="range" min="1" max="99" value="41"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="hull-core.js"></script><script src="main.js"></script></body></html>
