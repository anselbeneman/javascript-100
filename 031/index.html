<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript polygon clipping studio using Sutherland-Hodgman half-plane clipping, convex clip windows, polygon area metrics, Canvas 2D visualization, benchmark mode, PNG export, and JSON evidence."><title>031 - Polygon Clipping Studio</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">Polygon Clipping Studio</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="clipCanvas" width="1280" height="720" aria-label="Polygon clipping result"></canvas><div class="canvas-readout"><span id="windowBadge">Box</span><span id="scaleBadge">Scale 0.68</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Input</span><strong id="inputValue">0</strong></div><div><span>Clip</span><strong id="clipValue">0</strong></div><div><span>Output</span><strong id="outputValue">0</strong></div><div><span>Area In</span><strong id="areaInValue">0</strong></div><div><span>Area Out</span><strong id="areaOutValue">0</strong></div><div><span>Retained</span><strong id="ratioValue">0%</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Method</span><strong>S-H</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Clipper</h2><label for="windowSelect">Window</label><select id="windowSelect"><option value="box">Box</option><option value="diamond">Diamond</option><option value="hexagon">Hexagon</option></select><label for="scaleRange">Scale <span id="scaleValue">0.68</span></label><input id="scaleRange" type="range" min="38" max="88" value="68"><label for="pointRange">Subject vertices <span id="pointValue">11</span></label><input id="pointRange" type="range" min="5" max="17" value="11"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="clip-core.js"></script><script src="main.js"></script></body></html>
