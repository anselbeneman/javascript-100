<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Vanilla JavaScript L-system generator with deterministic rewriting, turtle graphics, bracketed branching, Canvas 2D rendering, structural metrics, benchmark mode, PNG export, and JSON evidence."><title>028 - L-System Garden</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell" aria-labelledby="project-title"><h1 id="project-title" class="visually-hidden">L-System Garden</h1><section class="viewport-panel"><div class="canvas-frame" id="canvasFrame"><canvas id="lsystemCanvas" width="1280" height="720" aria-label="Generated L-system plant"></canvas><div class="canvas-readout"><span id="presetBadge">Fern</span><span id="growthBadge">4 iterations</span><span id="statusBadge">Ready</span></div></div><div class="metrics-bar"><div><span>Segments</span><strong id="segmentValue">0</strong></div><div><span>Symbols</span><strong id="symbolValue">0</strong></div><div><span>Branches</span><strong id="branchValue">0</strong></div><div><span>Depth</span><strong id="depthValue">0</strong></div><div><span>Bounds</span><strong id="boundsValue">0 x 0</strong></div><div><span>Bench</span><strong id="benchmarkValue">Not run</strong></div><div><span>Grammar</span><strong>L-System</strong></div><div><span>Render</span><strong>Canvas</strong></div></div></section><aside class="control-panel"><section class="control-group"><h2>Growth</h2><label for="presetSelect">Preset</label><select id="presetSelect"><option value="fern">Fern</option><option value="bush">Bush</option><option value="crystal">Crystal</option></select><label for="iterationRange">Iterations <span id="iterationValue">4</span></label><input id="iterationRange" type="range" min="1" max="5" value="4"><label for="angleRange">Angle <span id="angleValue">25</span></label><input id="angleRange" type="range" min="12" max="96" value="25"></section><section class="control-group"><h2>Evidence</h2><div class="button-row"><button id="benchmarkButton" type="button">Benchmark</button><button id="pngButton" type="button">PNG</button></div><div class="button-row"><button id="jsonButton" type="button">JSON</button><button id="reportButton" type="button">Report</button></div></section></aside></main><script src="lsystem-core.js"></script><script src="main.js"></script></body></html>
